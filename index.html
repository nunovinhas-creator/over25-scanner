<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over 2.5 Scanner — Bzzoiro</title>
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #085041;
    --amber: #BA7517; --amber-light: #FAEEDA; --amber-dark: #633806;
    --red: #993C1D; --red-light: #FAECE7;
    --gray: #888780; --gray-light: #F1EFE8;
    --blue: #185FA5; --blue-light: #E6F1FB;
    --bg: #ffffff; --bg2: #f7f6f3; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --green-light: #04342c; --green-dark: #9FE1CB;
      --amber-light: #412402; --amber-dark: #FAC775;
      --red-light: #501313; --red: #E24B4A;
      --blue-light: #042C53; --blue: #85B7EB;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .app { max-width: 920px; margin: 0 auto; padding: 24px 16px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .header p { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .badge-green { background: var(--green-light); color: var(--green-dark); }
  .badge-amber { background: var(--amber-light); color: var(--amber-dark); }
  .badge-gray  { background: var(--gray-light);  color: var(--gray); }
  .badge-red   { background: var(--red-light);   color: var(--red); }
  .api-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .api-box label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .api-box input { flex: 1; min-width: 200px; font-size: 13px; padding: 7px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); font-family: monospace; }
  .api-box input:focus { outline: none; border-color: var(--blue); }
  .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .controls select { font-size: 13px; padding: 7px 10px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; }
  .controls label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .btn { font-size: 13px; padding: 8px 16px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: background 0.15s; }
  .btn:hover { background: var(--bg3); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: #0F6E56; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; border: 0.5px solid var(--border); }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 999px; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { background: var(--bg2); }
  .filter-btn.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue); font-weight: 500; }
  .match-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.15s; }
  .match-card:hover { border-color: var(--border2); }
  .match-card.high { border-left: 3px solid var(--green); }
  .match-card.mid  { border-left: 3px solid var(--amber); }
  .match-card.low  { border-left: 3px solid var(--border); }
  .match-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .match-teams { font-size: 15px; font-weight: 600; color: var(--text); }
  .match-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .score-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .sc-high { background: var(--green-light); color: var(--green-dark); }
  .sc-mid  { background: var(--amber-light); color: var(--amber-dark); }
  .sc-low  { background: var(--gray-light);  color: var(--gray); }
  .score-label { font-size: 10px; color: var(--text3); }
  .signal-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 10px 0 0; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; }
  .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .metric-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
  .metric-value { font-size: 13px; font-weight: 500; color: var(--text); }
  .mv-green { color: var(--green); }
  .mv-amber { color: var(--amber); }
  .mv-red   { color: var(--red); }
  .expand-btn { font-size: 11px; color: var(--text3); cursor: pointer; margin-top: 10px; background: none; border: none; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
  .expand-btn:hover { color: var(--text2); }
  .odds-table { width: 100%; font-size: 12px; margin-top: 8px; border-collapse: collapse; }
  .odds-table th { text-align: left; color: var(--text3); font-weight: 500; padding: 4px 6px; border-bottom: 0.5px solid var(--border); }
  .odds-table td { padding: 5px 6px; border-bottom: 0.5px solid var(--border); color: var(--text2); }
  .odds-table tr:last-child td { border-bottom: none; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .error-box { background: var(--red-light); border: 0.5px solid var(--red); border-radius: var(--radius); padding: 12px 16px; color: var(--red); font-size: 13px; margin-bottom: 16px; }
  .debug-box { font-size: 12px; color: var(--text3); margin-bottom: 12px; padding: 8px 12px; background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); display: none; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; display: none; }
  .last-update { font-size: 11px; color: var(--text3); }
  @media (max-width: 600px) { .match-grid { grid-template-columns: repeat(2, 1fr); } .stats-row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>⚽ Over 2.5 Scanner <span class="badge badge-green">Live</span></h1>
      <p>Sistema profissional — ML CatBoost · Odds Movement · Sharp Money Detection</p>
    </div>
    <span class="last-update" id="lastUpdate"></span>
  </div>

  <div class="api-box">
    <label for="apiKey">🔑 API Key:</label>
    <input type="password" id="apiKey" placeholder="Token Bzzoiro..." value="7546ea6a7ec7d581b1df628d6785d4e609ad660a">
    <button class="btn btn-primary" id="loadBtn" onclick="loadAll()">▶ Carregar jogos</button>
    <button class="btn" onclick="loadAll()">↻ Atualizar</button>
  </div>

  <div id="errorBox" class="error-box" style="display:none"></div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Jogos analisados</div><div class="stat-value" id="sTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Score alto ≥ 70</div><div class="stat-value" id="sHigh">—</div><div class="stat-sub">picks fortes</div></div>
    <div class="stat-card"><div class="stat-label">ML recomenda</div><div class="stat-value" id="sML">—</div></div>
    <div class="stat-card"><div class="stat-label">Odds média Over 2.5</div><div class="stat-value" id="sOdds">—</div></div>
  </div>

  <div class="controls">
    <label>Ligas: <select id="leagueFilter" onchange="render()"><option value="all">Todas</option></select></label>
    <label>Score mínimo:
      <select id="scoreFilter" onchange="render()">
        <option value="0">Todos</option>
        <option value="40">≥ 40</option>
        <option value="50">≥ 50</option>
        <option value="60">≥ 60</option>
        <option value="70">≥ 70</option>
      </select>
    </label>
    <label>Ordenar:
      <select id="sortFilter" onchange="render()">
        <option value="score">Por score</option>
        <option value="prob">Por prob. ML</option>
        <option value="odds">Por odds</option>
        <option value="date">Por data</option>
      </select>
    </label>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setTier(this,'all')">Todos</button>
    <button class="filter-btn" onclick="setTier(this,'high')">🟢 Alto ≥ 70</button>
    <button class="filter-btn" onclick="setTier(this,'mid')">🟡 Médio 50–69</button>
    <button class="filter-btn" onclick="setTier(this,'low')">⚪ Baixo &lt; 50</button>
    <button class="filter-btn" onclick="setTier(this,'ml')">🤖 ML recomenda</button>
    <button class="filter-btn" onclick="setTier(this,'short')">📉 Odds a baixar</button>
  </div>

  <div class="debug-box" id="debugBox"></div>
  <div class="section-title" id="sectionTitle"></div>
  <div id="matchList">
    <div class="empty"><div style="font-size:48px;margin-bottom:16px">⚽</div>Clica em <strong>Carregar jogos</strong> para analisar as próximas 48h</div>
  </div>

</div>
<script>
const BASE = 'https://sports.bzzoiro.com';
let allMatches = [], activeTier = 'all', leagueNames = {};

function apiKey() { return document.getElementById('apiKey').value.trim(); }

async function get(path) {
  const r = await fetch(BASE + path, {
    headers: { 'Authorization': 'Token ' + apiKey(), 'Accept': 'application/json' }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + path);
  return r.json();
}

function toArr(r) { return Array.isArray(r) ? r : (r.results || r.data || []); }

async function loadAll() {
  const btn = document.getElementById('loadBtn');
  btn.disabled = true; btn.textContent = '⏳ A carregar...';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('matchList').innerHTML = '<div class="loading"><div class="spinner"></div>A carregar jogos das próximas 48h...</div>';

  try {
    const now = new Date();
    const df = now.toISOString().split('T')[0];
    const dt = new Date(now.getTime() + 48 * 3600000).toISOString().split('T')[0];

    // 1. Eventos + previsões em paralelo
    const [evRes, predRes] = await Promise.all([
      get('/api/v2/events/?status=notstarted&date_from=' + df + '&date_to=' + dt + '&limit=100'),
      get('/api/v2/predictions/?status=upcoming&date_from=' + df + '&date_to=' + dt + '&limit=100')
    ]);
    const events = toArr(evRes);
    const preds  = toArr(predRes);

    // 2. Mapa de previsões por event.id + fallback por equipas
    const predById = {}, predByTeams = {};
    preds.forEach(p => {
      if (p.event?.id) predById[p.event.id] = p;
      if (p.event?.home_team && p.event?.away_team) {
        predByTeams[(p.event.home_team + '|' + p.event.away_team).toLowerCase()] = p;
      }
    });
    events.forEach(ev => {
      if (!predById[ev.id]) {
        const k = (ev.home_team + '|' + ev.away_team).toLowerCase();
        if (predByTeams[k]) predById[ev.id] = predByTeams[k];
      }
    });

    // 3. Odds — tenta /api/v2/events/{id}/odds/ para cada evento
    const oddsById = {};
    await Promise.all(events.map(ev =>
      get('/api/v2/events/' + ev.id + '/odds/')
        .then(r => { if (r) oddsById[ev.id] = r; })
        .catch(() =>
          // fallback: endpoint de odds filtrado
          get('/api/v2/odds/?event_id=' + ev.id + '&market=over_under_25')
            .then(r2 => { const a = toArr(r2); if (a.length) oddsById[ev.id] = a; })
            .catch(() => {})
        )
    ));

    // 4. Nomes das ligas
    leagueNames = {};
    events.forEach(e => { if (e.league_id) leagueNames[e.league_id] = 'Liga ' + e.league_id; });
    try {
      toArr(await get('/api/v2/leagues/?limit=200')).forEach(l => {
        leagueNames[l.id] = l.name + (l.country ? ' (' + l.country + ')' : '');
      });
    } catch(e) {}

    // 5. Filtro de ligas
    const sel = document.getElementById('leagueFilter');
    sel.innerHTML = '<option value="all">Todas as ligas</option>';
    Object.entries(leagueNames).sort((a,b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
      const o = document.createElement('option'); o.value = id; o.textContent = name; sel.appendChild(o);
    });

    // 6. Constrói matches com score
    allMatches = events.map(ev => {
      const pred    = predById[ev.id] || null;
      const rawOdds = oddsById[ev.id] || null;

      // prob Over 2.5 — API pode devolver 0-100 ou 0-1
      const rawProb    = pred?.markets?.over_under?.prob_over_25 ?? null;
      const prob25     = rawProb != null ? (rawProb > 1 ? rawProb / 100 : rawProb) : null;
      const recommend  = pred?.recommendations?.over_25 ?? false;
      const rawConf    = pred?.model?.confidence ?? null;
      const confidence = rawConf != null ? (rawConf > 1 ? rawConf / 100 : rawConf) : null;
      const predScore  = pred?.markets?.score?.most_likely ?? null;

      // Extrai odds Over 2.5 de diferentes formatos possíveis
      let over25odds = null, under25odds = null, movement = null, allOddsArr = [];

      if (Array.isArray(rawOdds)) {
        // Array de OddsItemV2Schema
        allOddsArr  = rawOdds;
        const ov    = rawOdds.find(o => o.outcome === 'over');
        const un    = rawOdds.find(o => o.outcome === 'under');
        over25odds  = ov?.decimal_odds ?? null;
        under25odds = un?.decimal_odds ?? null;
        movement    = ov?.movement || null;
      } else if (rawOdds && typeof rawOdds === 'object') {
        // Objeto com mercados: {markets: {over_under_25: {over: X, under: Y}}}
        const ou = rawOdds.markets?.over_under_25
                || rawOdds.over_under_25
                || rawOdds['over_under_2.5']
                || null;
        if (ou) {
          // Pode ser {over: {decimal_odds, movement}, under: {...}}
          if (ou.over?.decimal_odds) {
            over25odds  = ou.over.decimal_odds;
            under25odds = ou.under?.decimal_odds ?? null;
            movement    = ou.over?.movement || null;
          } else if (typeof ou.over === 'number') {
            over25odds  = ou.over;
            under25odds = ou.under ?? null;
          }
        }
      }

      const { score, signals } = calcScore(prob25, recommend, over25odds, movement, confidence);
      return {
        id: ev.id, home_team: ev.home_team, away_team: ev.away_team,
        league_id: ev.league_id, event_date: ev.event_date,
        prob25, recommend, confidence, predScore,
        over25odds, under25odds, movement, allOddsArr,
        score, signals, tier: getTier(score)
      };
    });

    // 7. Debug
    const wP = allMatches.filter(m => m.prob25 != null).length;
    const wO = allMatches.filter(m => m.over25odds != null).length;
    const db = document.getElementById('debugBox');
    db.style.display = 'block';
    db.innerHTML = '🔍 <strong>' + events.length + '</strong> eventos · <strong>' + preds.length + '</strong> previsões ML · <strong>' + wP + '</strong> com prob. · <strong>' + wO + '</strong> com odds Over 2.5';

    updateStats();
    render();
    document.getElementById('lastUpdate').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-PT');

  } catch(err) {
    const eb = document.getElementById('errorBox');
    eb.textContent = '⚠ Erro: ' + err.message; eb.style.display = 'block';
    document.getElementById('matchList').innerHTML = '<div class="empty">Erro ao carregar dados.</div>';
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = '▶ Carregar jogos';
  }
}

// ── Scoring ──────────────────────────────────────────────────────────────────
function calcScore(prob25, recommend, odds, movement, confidence) {
  let s = 0; const sig = [];
  if (prob25 != null) {
    const p = prob25 > 1 ? prob25 : prob25 * 100;
    if (p >= 70)      { s += 35; sig.push({ t: 'ML ' + p.toFixed(0) + '%', c: 'green' }); }
    else if (p >= 60) { s += 25; sig.push({ t: 'ML ' + p.toFixed(0) + '%', c: 'green' }); }
    else if (p >= 50) { s += 15; sig.push({ t: 'ML ' + p.toFixed(0) + '%', c: 'amber' }); }
    else if (p >= 40) { s += 5;  sig.push({ t: 'ML ' + p.toFixed(0) + '%', c: 'gray'  }); }
  }
  if (recommend) { s += 15; sig.push({ t: 'ML recomenda', c: 'green' }); }
  if (movement === 'SHORTENING') { s += 20; sig.push({ t: '↘ Odds a baixar', c: 'green' }); }
  else if (movement === 'DRIFTING') { s -= 10; sig.push({ t: '↗ Odds a subir', c: 'red' }); }
  if (odds) {
    if (odds <= 1.55)      { s += 15; sig.push({ t: 'Odds ' + odds.toFixed(2), c: 'green' }); }
    else if (odds <= 1.75) { s += 8;  sig.push({ t: 'Odds ' + odds.toFixed(2), c: 'amber' }); }
    else if (odds <= 1.90) { s += 3; }
    else if (odds >= 2.20) { s -= 5;  sig.push({ t: 'Odds altas ' + odds.toFixed(2), c: 'red' }); }
  }
  if (confidence != null && confidence >= 0.7) { s += 5; sig.push({ t: 'Alta confiança', c: 'green' }); }
  return { score: Math.max(0, Math.min(100, Math.round(s))), signals: sig };
}

function getTier(s) { return s >= 70 ? 'high' : s >= 50 ? 'mid' : 'low'; }

function updateStats() {
  document.getElementById('sTotal').textContent = allMatches.length;
  document.getElementById('sHigh').textContent  = allMatches.filter(m => m.score >= 70).length;
  document.getElementById('sML').textContent    = allMatches.filter(m => m.recommend).length;
  const arr = allMatches.map(m => m.over25odds).filter(Boolean);
  document.getElementById('sOdds').textContent  = arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2) : '—';
}

function setTier(btn, t) {
  activeTier = t;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const minS   = parseInt(document.getElementById('scoreFilter').value) || 0;
  const league = document.getElementById('leagueFilter').value;
  const sortBy = document.getElementById('sortFilter').value;

  let list = allMatches.filter(m => {
    if (m.score < minS) return false;
    if (league !== 'all' && String(m.league_id) !== league) return false;
    if (activeTier === 'high'  && m.tier !== 'high') return false;
    if (activeTier === 'mid'   && m.tier !== 'mid')  return false;
    if (activeTier === 'low'   && m.tier !== 'low')  return false;
    if (activeTier === 'ml'    && !m.recommend)       return false;
    if (activeTier === 'short' && m.movement !== 'SHORTENING') return false;
    return true;
  });

  list.sort((a, b) => {
    if (sortBy === 'score') return b.score - a.score;
    if (sortBy === 'prob')  return (b.prob25 || 0) - (a.prob25 || 0);
    if (sortBy === 'odds')  return (a.over25odds || 99) - (b.over25odds || 99);
    return new Date(a.event_date) - new Date(b.event_date);
  });

  const st = document.getElementById('sectionTitle');
  st.style.display = 'block';
  st.textContent = list.length + ' jogo' + (list.length !== 1 ? 's' : '') + ' encontrado' + (list.length !== 1 ? 's' : '');

  if (!list.length) {
    document.getElementById('matchList').innerHTML = '<div class="empty">Nenhum jogo com estes filtros.</div>';
    return;
  }
  document.getElementById('matchList').innerHTML = list.map(card).join('');
}

function card(m) {
  const sc  = m.tier === 'high' ? 'sc-high' : m.tier === 'mid' ? 'sc-mid' : 'sc-low';
  const pc  = m.tier === 'high' ? '#1D9E75' : m.tier === 'mid' ? '#BA7517' : '#888780';
  const lg  = leagueNames[m.league_id] || 'Liga ' + m.league_id;
  const dt  = new Date(m.event_date);
  const ds  = dt.toLocaleDateString('pt-PT', { weekday:'short', day:'2-digit', month:'2-digit' }) + ' ' + dt.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });

  const pct   = m.prob25 != null ? (m.prob25 > 1 ? m.prob25 : m.prob25 * 100) : null;
  const mlStr = pct != null ? pct.toFixed(1) + '%' : '—';
  const mlCls = pct != null ? (pct >= 60 ? 'mv-green' : pct >= 45 ? 'mv-amber' : 'mv-red') : '';
  const odCls = m.over25odds ? (m.over25odds <= 1.65 ? 'mv-green' : m.over25odds <= 1.85 ? 'mv-amber' : '') : '';
  const mvCls = m.movement === 'SHORTENING' ? 'mv-green' : m.movement === 'DRIFTING' ? 'mv-red' : '';
  const mvStr = m.movement === 'SHORTENING' ? '↘ Shortening' : m.movement === 'DRIFTING' ? '↗ Drifting' : '—';
  const cfStr = m.confidence != null ? (m.confidence > 1 ? m.confidence : m.confidence * 100).toFixed(0) + '%' : '—';

  const pills = m.signals.map(s => {
    const cls = s.c === 'green' ? 'badge-green' : s.c === 'amber' ? 'badge-amber' : s.c === 'red' ? 'badge-red' : 'badge-gray';
    return '<span class="badge ' + cls + '">' + s.t + '</span>';
  }).join('') || '<span class="badge badge-gray">Sem sinais fortes</span>';

  const bkOdds = Array.isArray(m.allOddsArr)
    ? m.allOddsArr.filter(o => o.outcome === 'over').sort((a,b) => b.decimal_odds - a.decimal_odds).slice(0, 5)
    : [];
  const oddsSection = bkOdds.length ? `
    <button class="expand-btn" onclick="toggleOdds(${m.id})">▼ Ver odds por bookmaker (${bkOdds.length})</button>
    <div id="o${m.id}" style="display:none;margin-top:8px">
      <table class="odds-table">
        <thead><tr><th>Bookmaker</th><th>Over 2.5</th><th>Movimento</th></tr></thead>
        <tbody>${bkOdds.map(o =>
          '<tr><td>' + (o.bookmaker_name || o.bookmaker_slug || '—') + '</td>' +
          '<td style="font-weight:500;color:var(--text)">' + o.decimal_odds.toFixed(2) + '</td>' +
          '<td class="' + (o.movement === 'SHORTENING' ? 'mv-green' : o.movement === 'DRIFTING' ? 'mv-red' : '') + '">' + (o.movement || '—') + '</td></tr>'
        ).join('')}</tbody>
      </table>
    </div>` : '';

  return '<div class="match-card ' + m.tier + '">' +
    '<div class="match-top">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="match-teams">' + m.home_team + ' <span style="color:var(--text3);font-weight:400">vs</span> ' + m.away_team + '</div>' +
        '<div class="match-meta">🏆 ' + lg + ' &nbsp;·&nbsp; 📅 ' + ds + '</div>' +
        '<div class="signal-row">' + pills + '</div>' +
      '</div>' +
      '<div class="score-wrap">' +
        '<div class="score-circle ' + sc + '">' + m.score + '</div>' +
        '<div class="score-label">score</div>' +
      '</div>' +
    '</div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + m.score + '%;background:' + pc + '"></div></div>' +
    '<div class="match-grid">' +
      '<div><div class="metric-label">Prob. Over 2.5</div><div class="metric-value ' + mlCls + '">' + mlStr + '</div></div>' +
      '<div><div class="metric-label">Odds Over 2.5</div><div class="metric-value ' + odCls + '">' + (m.over25odds ? m.over25odds.toFixed(2) : '—') + '</div></div>' +
      '<div><div class="metric-label">Odds Under 2.5</div><div class="metric-value">' + (m.under25odds ? m.under25odds.toFixed(2) : '—') + '</div></div>' +
      '<div><div class="metric-label">Movimento</div><div class="metric-value ' + mvCls + '">' + mvStr + '</div></div>' +
      '<div><div class="metric-label">Score previsto</div><div class="metric-value">' + (m.predScore || '—') + '</div></div>' +
      '<div><div class="metric-label">Confiança ML</div><div class="metric-value">' + cfStr + '</div></div>' +
      '<div><div class="metric-label">ML recomenda</div><div class="metric-value ' + (m.recommend ? 'mv-green' : '') + '">' + (m.recommend ? '✓ Sim' : 'Não') + '</div></div>' +
    '</div>' +
    oddsSection +
  '</div>';
}

function toggleOdds(id) {
  const el = document.getElementById('o' + id);
  const btn = el.previousElementSibling;
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  btn.textContent = open ? '▲ Fechar odds' : '▼ Ver odds por bookmaker';
}
</script>
</body>
</html>
