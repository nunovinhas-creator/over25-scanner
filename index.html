<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over 2.5 Scanner — Bzzoiro</title>
<style>
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #085041;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --amber-dark: #633806;
    --red: #993C1D;
    --red-light: #FAECE7;
    --gray: #888780;
    --gray-light: #F1EFE8;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --bg: #ffffff;
    --bg2: #f7f6f3;
    --bg3: #f0efe9;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --green-light: #04342c; --green: #1D9E75; --green-dark: #9FE1CB;
      --amber-light: #412402; --amber: #EF9F27; --amber-dark: #FAC775;
      --red-light: #501313; --red: #E24B4A; --blue-light: #042C53; --blue: #85B7EB;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header-left h1 { font-size: 22px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .header-left p { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .badge-green { background: var(--green-light); color: var(--green-dark); }
  .badge-amber { background: var(--amber-light); color: var(--amber-dark); }
  .badge-gray { background: var(--gray-light); color: var(--gray); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }

  /* API Key input */
  .api-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .api-box label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .api-box input { flex: 1; min-width: 200px; font-size: 13px; padding: 7px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); font-family: monospace; }
  .api-box input:focus { outline: none; border-color: var(--blue); }

  /* Controls */
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .controls select { font-size: 13px; padding: 7px 10px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; }
  .controls label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .btn { font-size: 13px; padding: 8px 16px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: background 0.15s; }
  .btn:hover { background: var(--bg3); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: #0F6E56; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; border: 0.5px solid var(--border); }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Filter pills */
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 999px; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { background: var(--bg2); }
  .filter-btn.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue); font-weight: 500; }

  /* Match cards */
  .match-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.15s, box-shadow 0.15s; }
  .match-card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .match-card.high { border-left: 3px solid var(--green); }
  .match-card.mid { border-left: 3px solid var(--amber); }
  .match-card.low { border-left: 3px solid var(--border); }
  .match-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .match-teams { font-size: 15px; font-weight: 600; color: var(--text); }
  .match-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .score-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .sc-high { background: var(--green-light); color: var(--green-dark); }
  .sc-mid { background: var(--amber-light); color: var(--amber-dark); }
  .sc-low { background: var(--gray-light); color: var(--gray); }
  .score-label { font-size: 10px; color: var(--text3); }
  .signal-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 10px 0 0; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .metric-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
  .metric-value { font-size: 13px; font-weight: 500; color: var(--text); }
  .mv-green { color: var(--green); }
  .mv-amber { color: var(--amber); }
  .mv-red { color: var(--red); }
  .expand-btn { font-size: 11px; color: var(--text3); cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; padding: 0; }
  .expand-btn:hover { color: var(--text2); }
  .odds-table { width: 100%; font-size: 12px; margin-top: 8px; border-collapse: collapse; }
  .odds-table th { text-align: left; color: var(--text3); font-weight: 500; padding: 4px 6px; border-bottom: 0.5px solid var(--border); }
  .odds-table td { padding: 4px 6px; border-bottom: 0.5px solid var(--border); color: var(--text2); }
  .odds-table tr:last-child td { border-bottom: none; }

  /* States */
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .error-box { background: var(--red-light); border: 0.5px solid var(--red); border-radius: var(--radius); padding: 12px 16px; color: var(--red); font-size: 13px; margin-bottom: 16px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .last-update { font-size: 11px; color: var(--text3); margin-left: auto; }

  /* Responsive */
  @media (max-width: 600px) {
    .match-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <h1>⚽ Over 2.5 Scanner <span class="badge badge-green">Live</span></h1>
      <p>Sistema profissional — ML CatBoost · Odds Movement · Análise de valor</p>
    </div>
    <span class="last-update" id="lastUpdate"></span>
  </div>

  <div class="api-box">
    <label for="apiKey">🔑 API Key Bzzoiro:</label>
    <input type="password" id="apiKey" placeholder="Token da API..." value="7546ea6a7ec7d581b1df628d6785d4e609ad660a">
    <button class="btn btn-primary" id="loadBtn" onclick="loadAll()">▶ Carregar jogos</button>
    <button class="btn" onclick="loadAll()" title="Atualizar">↻ Atualizar</button>
  </div>

  <div id="errorBox" style="display:none"></div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Jogos analisados</div><div class="stat-value" id="sTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Score alto ≥ 70</div><div class="stat-value" id="sHigh">—</div><div class="stat-sub">picks fortes</div></div>
    <div class="stat-card"><div class="stat-label">ML recomenda</div><div class="stat-value" id="sML">—</div></div>
    <div class="stat-card"><div class="stat-label">Odds média Over 2.5</div><div class="stat-value" id="sOdds">—</div></div>
  </div>

  <div class="controls">
    <label>Ligas: <select id="leagueFilter" onchange="renderMatches()"><option value="all">Todas</option></select></label>
    <label>Score mínimo: <select id="scoreFilter" onchange="renderMatches()">
      <option value="0">Todos</option>
      <option value="40">≥ 40</option>
      <option value="50" selected>≥ 50</option>
      <option value="60">≥ 60</option>
      <option value="70">≥ 70</option>
    </select></label>
    <label>Ordenar: <select id="sortFilter" onchange="renderMatches()">
      <option value="score">Por score</option>
      <option value="odds">Por odds</option>
      <option value="date">Por data/hora</option>
      <option value="prob">Por prob. ML</option>
    </select></label>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setTier(this,'all')">Todos</button>
    <button class="filter-btn" onclick="setTier(this,'high')">🟢 Alto ≥ 70</button>
    <button class="filter-btn" onclick="setTier(this,'mid')">🟡 Médio 50–69</button>
    <button class="filter-btn" onclick="setTier(this,'low')">⚪ Baixo &lt; 50</button>
    <button class="filter-btn" onclick="setTier(this,'ml')">🤖 ML recomenda</button>
    <button class="filter-btn" onclick="setTier(this,'short')">📉 Odds a baixar</button>
  </div>

  <div id="debugInfo" style="display:none;font-size:12px;color:var(--text3);margin-bottom:12px;padding:8px 12px;background:var(--bg2);border-radius:var(--radius);border:0.5px solid var(--border);"></div>
  <div id="sectionTitle" class="section-title" style="display:none"></div>
  <div id="matchList">
    <div class="empty">
      <div style="font-size:48px;margin-bottom:16px">⚽</div>
      Clica em <strong>Carregar jogos</strong> para analisar as próximas 48h
    </div>
  </div>

</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const BASE_URL = 'https://sports.bzzoiro.com';
let allMatches = [];
let activeTier = 'all';
let leagueNames = {};

// ─── API helper ───────────────────────────────────────────────────────────────
async function api(path) {
  const key = document.getElementById('apiKey').value.trim();
  const res = await fetch(BASE_URL + path, {
    headers: { 'Authorization': 'Token ' + key, 'Accept': 'application/json' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' em ' + path);
  return res.json();
}

// ─── Load all data ─────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('loadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ A carregar...';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('matchList').innerHTML = '<div class="loading"><div class="spinner"></div>A ir buscar jogos das próximas 48h...</div>';

  try {
    const now = new Date();
    const plus48 = new Date(now.getTime() + 48 * 3600000);
    const df = now.toISOString().split('T')[0];
    const dt = plus48.toISOString().split('T')[0];

    // Parallel fetches
    const [evRes, predRes, oddsRes] = await Promise.all([
      api('/api/v2/events/?status=notstarted&date_from=' + df + '&date_to=' + dt + '&limit=100'),
      api('/api/v2/predictions/?status=upcoming&date_from=' + df + '&date_to=' + dt + '&limit=100'),
      api('/api/v2/odds/?market=over_under_25&limit=200')
    ]);

    const events  = Array.isArray(evRes)   ? evRes   : (evRes.results   || []);
    const preds   = Array.isArray(predRes) ? predRes : (predRes.results  || []);
    const odds    = Array.isArray(oddsRes) ? oddsRes : (oddsRes.results  || []);

    // Maps — previsões indexadas por event.id
    const predMap = {};
    preds.forEach(p => { if (p.event?.id) predMap[p.event.id] = p; });

    // Fallback: cruza por home_team + away_team se IDs não batem
    const predByTeams = {};
    preds.forEach(p => {
      if (p.event?.home_team && p.event?.away_team) {
        const key = (p.event.home_team + '|' + p.event.away_team).toLowerCase();
        predByTeams[key] = p;
      }
    });
    events.forEach(ev => {
      if (!predMap[ev.id]) {
        const key = (ev.home_team + '|' + ev.away_team).toLowerCase();
        if (predByTeams[key]) predMap[ev.id] = predByTeams[key];
      }
    });

    const oddsMap = {};
    odds.forEach(o => {
      if (!oddsMap[o.event_id]) oddsMap[o.event_id] = [];
      oddsMap[o.event_id].push(o);
    });

    // Debug no console
    console.log('Eventos:', events.length, '| Previsoes:', preds.length, '| Odds:', odds.length);
    console.log('Com previsao:', events.filter(e => predMap[e.id]).length, '| Com odds:', events.filter(e => oddsMap[e.id]?.length).length);

    // League names from events
    leagueNames = {};
    events.forEach(e => {
      if (e.league_id && !leagueNames[e.league_id]) leagueNames[e.league_id] = 'Liga ' + e.league_id;
    });

    // Try to get league names
    try {
      const lgRes = await api('/api/v2/leagues/?limit=100');
      const lgs = Array.isArray(lgRes) ? lgRes : (lgRes.results || []);
      lgs.forEach(l => { leagueNames[l.id] = l.name + ' (' + l.country + ')'; });
    } catch(e) {}

    // Build league filter
    const leagueSelect = document.getElementById('leagueFilter');
    leagueSelect.innerHTML = '<option value="all">Todas as ligas</option>';
    Object.entries(leagueNames).sort((a,b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = name;
      leagueSelect.appendChild(opt);
    });

    // Score & build matches
    allMatches = events.map(ev => {
      const pred = predMap[ev.id] || null;
      const evOdds = oddsMap[ev.id] || [];
      const over = evOdds.find(o => o.outcome === 'over');
      const under = evOdds.find(o => o.outcome === 'under');

      // API devolve prob em 0-100, normaliza para 0-1
      const rawProb   = pred?.markets?.over_under?.prob_over_25 ?? null;
      const prob25    = rawProb != null ? (rawProb > 1 ? rawProb / 100 : rawProb) : null;
      const recommend = pred?.recommendations?.over_25 ?? false;
      const rawConf   = pred?.model?.confidence ?? null;
      const confidence = rawConf != null ? (rawConf > 1 ? rawConf / 100 : rawConf) : null;
      const predScore  = pred?.markets?.score?.most_likely ?? null;
      const over25odds = over?.decimal_odds ?? null;
      const movement   = over?.movement || null;

      const { score, signals } = calcScore(prob25, recommend, over25odds, movement, confidence);
      const tier = getTier(score);

      return {
        id: ev.id,
        home_team: ev.home_team,
        away_team: ev.away_team,
        league_id: ev.league_id,
        event_date: ev.event_date,
        prob25, recommend, confidence, predScore,
        over25odds,
        under25odds: under?.decimal_odds ?? null,
        movement,
        allOdds: evOdds,
        score, signals, tier,
        pred
      };
    });

    updateStats();
    renderMatches();
    document.getElementById('lastUpdate').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-PT');

    // Mostra debug info
    const withPred = events.filter(e => predMap[e.id]).length;
    const withOdds = events.filter(e => oddsMap[e.id]?.length).length;
    const debugEl = document.getElementById('debugInfo');
    if (debugEl) {
      debugEl.style.display = 'block';
      debugEl.innerHTML = '🔍 Debug: <strong>' + events.length + '</strong> eventos | <strong>' + preds.length + '</strong> previsões ML | <strong>' + odds.length + '</strong> odds | Cruzados: <strong>' + withPred + '</strong> com ML, <strong>' + withOdds + '</strong> com odds';
    }

  } catch(err) {
    showError('Erro ao carregar: ' + err.message + '. Verifica a API key e tenta novamente.');
    document.getElementById('matchList').innerHTML = '<div class="empty">Erro ao carregar dados.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Carregar jogos';
  }
}

// ─── Scoring system ────────────────────────────────────────────────────────────
function calcScore(prob25, recommend, odds, movement, confidence) {
  let score = 0;
  const signals = [];

  // 1. Probabilidade ML (0–35 pts)
  if (prob25 != null) {
    const pct = prob25 > 1 ? prob25 : prob25 * 100;
    if (pct >= 70)      { score += 35; signals.push({ t: 'ML ' + pct.toFixed(0) + '%', c: 'green' }); }
    else if (pct >= 60) { score += 25; signals.push({ t: 'ML ' + pct.toFixed(0) + '%', c: 'green' }); }
    else if (pct >= 50) { score += 15; signals.push({ t: 'ML ' + pct.toFixed(0) + '%', c: 'amber' }); }
    else if (pct >= 40) { score += 5;  signals.push({ t: 'ML ' + pct.toFixed(0) + '%', c: 'gray' }); }
  }

  // 2. ML recomenda (0–15 pts)
  if (recommend) { score += 15; signals.push({ t: 'ML recomenda', c: 'green' }); }

  // 3. Movimento de odds (sharp money)
  if (movement === 'SHORTENING') { score += 20; signals.push({ t: '↘ Odds a baixar', c: 'green' }); }
  else if (movement === 'DRIFTING') { score -= 10; signals.push({ t: '↗ Odds a subir', c: 'red' }); }

  // 4. Nível das odds (implica expectativa de mercado)
  if (odds) {
    if (odds <= 1.55)      { score += 15; signals.push({ t: 'Odds ' + odds.toFixed(2) + ' (favorito)', c: 'green' }); }
    else if (odds <= 1.75) { score += 8;  signals.push({ t: 'Odds ' + odds.toFixed(2), c: 'amber' }); }
    else if (odds <= 1.90) { score += 3; }
    else if (odds >= 2.20) { score -= 5; signals.push({ t: 'Odds altas ' + odds.toFixed(2), c: 'red' }); }
  }

  // 5. Confiança do modelo
  if (confidence != null && confidence >= 0.7) { score += 5; signals.push({ t: 'Alta confiança ML', c: 'green' }); }

  return { score: Math.max(0, Math.min(100, Math.round(score))), signals };
}

function getTier(s) { return s >= 70 ? 'high' : s >= 50 ? 'mid' : 'low'; }

// ─── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('sTotal').textContent = allMatches.length;
  document.getElementById('sHigh').textContent  = allMatches.filter(m => m.score >= 70).length;
  document.getElementById('sML').textContent    = allMatches.filter(m => m.recommend).length;
  const oddsArr = allMatches.map(m => m.over25odds).filter(Boolean);
  const avg = oddsArr.length ? oddsArr.reduce((a,b)=>a+b,0)/oddsArr.length : null;
  document.getElementById('sOdds').textContent  = avg ? avg.toFixed(2) : '—';
}

// ─── Filter ────────────────────────────────────────────────────────────────────
function setTier(btn, tier) {
  activeTier = tier;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMatches();
}

// ─── Render ────────────────────────────────────────────────────────────────────
function renderMatches() {
  const minScore  = parseInt(document.getElementById('scoreFilter').value);
  const leagueId  = document.getElementById('leagueFilter').value;
  const sortBy    = document.getElementById('sortFilter').value;

  let filtered = allMatches.filter(m => {
    if (m.score < minScore) return false;
    if (leagueId !== 'all' && String(m.league_id) !== leagueId) return false;
    if (activeTier === 'high'  && m.tier !== 'high') return false;
    if (activeTier === 'mid'   && m.tier !== 'mid')  return false;
    if (activeTier === 'low'   && m.tier !== 'low')  return false;
    if (activeTier === 'ml'    && !m.recommend)       return false;
    if (activeTier === 'short' && m.movement !== 'SHORTENING') return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sortBy === 'score') return b.score - a.score;
    if (sortBy === 'odds')  return (a.over25odds || 99) - (b.over25odds || 99);
    if (sortBy === 'prob')  return (b.prob25 || 0) - (a.prob25 || 0);
    return new Date(a.event_date) - new Date(b.event_date);
  });

  const st = document.getElementById('sectionTitle');
  st.style.display = 'block';
  st.textContent = filtered.length + ' jogo' + (filtered.length !== 1 ? 's' : '') + ' encontrado' + (filtered.length !== 1 ? 's' : '');

  if (!filtered.length) {
    document.getElementById('matchList').innerHTML = '<div class="empty">Nenhum jogo com estes filtros.</div>';
    return;
  }

  document.getElementById('matchList').innerHTML = filtered.map(m => matchCard(m)).join('');
}

function matchCard(m) {
  const sc  = m.tier === 'high' ? 'sc-high' : m.tier === 'mid' ? 'sc-mid' : 'sc-low';
  const pc  = m.tier === 'high' ? '#1D9E75' : m.tier === 'mid' ? '#BA7517' : '#888780';
  const lgName = leagueNames[m.league_id] || 'Liga ' + m.league_id;
  const dt  = new Date(m.event_date);
  const dtStr = dt.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit' }) + ' ' + dt.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

  const mlPct   = m.prob25 != null ? (m.prob25 > 1 ? m.prob25.toFixed(1) : (m.prob25 * 100).toFixed(1)) + '%' : '—';
  const mlColor = m.prob25 != null ? ((m.prob25 > 1 ? m.prob25 : m.prob25*100) >= 60 ? 'mv-green' : (m.prob25 > 1 ? m.prob25 : m.prob25*100) >= 45 ? 'mv-amber' : 'mv-red') : '';
  const odColor = m.over25odds ? (m.over25odds <= 1.65 ? 'mv-green' : m.over25odds <= 1.85 ? 'mv-amber' : '') : '';
  const mvColor = m.movement === 'SHORTENING' ? 'mv-green' : m.movement === 'DRIFTING' ? 'mv-red' : '';
  const mvTxt   = m.movement === 'SHORTENING' ? '↘ Shortening' : m.movement === 'DRIFTING' ? '↗ Drifting' : '—';
  const confStr = m.confidence != null ? (m.confidence * 100).toFixed(0) + '%' : '—';

  const pills = m.signals.map(s => {
    const cls = s.c === 'green' ? 'badge-green' : s.c === 'amber' ? 'badge-amber' : s.c === 'red' ? 'badge' + ' style="background:var(--red-light);color:var(--red)"' : 'badge-gray';
    if (s.c === 'red') return `<span class="badge" style="background:var(--red-light);color:var(--red)">${s.t}</span>`;
    return `<span class="badge ${cls === 'badge-green' ? 'badge-green' : cls === 'badge-amber' ? 'badge-amber' : 'badge-gray'}">${s.t}</span>`;
  }).join('');

  // Best odds from all bookmakers
  const bestOdds = m.allOdds.filter(o => o.outcome === 'over').sort((a,b) => b.decimal_odds - a.decimal_odds).slice(0, 3);
  const oddsRows = bestOdds.map(o =>
    `<tr><td>${o.bookmaker_name || o.bookmaker_slug}</td><td style="font-weight:500;color:var(--text)">${o.decimal_odds.toFixed(2)}</td><td class="${o.movement === 'SHORTENING' ? 'mv-green' : o.movement === 'DRIFTING' ? 'mv-red' : ''}">${o.movement || '—'}</td></tr>`
  ).join('');

  return `
  <div class="match-card ${m.tier}" id="card-${m.id}">
    <div class="match-top">
      <div style="flex:1;min-width:0">
        <div class="match-teams">${m.home_team} <span style="color:var(--text3);font-weight:400">vs</span> ${m.away_team}</div>
        <div class="match-meta">🏆 ${lgName} &nbsp;·&nbsp; 📅 ${dtStr}</div>
        <div class="signal-row">${pills || '<span class="badge badge-gray">Sem sinais fortes</span>'}</div>
      </div>
      <div class="score-wrap">
        <div class="score-circle ${sc}">${m.score}</div>
        <div class="score-label">score</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${m.score}%;background:${pc}"></div></div>
    <div class="match-grid">
      <div>
        <div class="metric-label">Prob. Over 2.5 (ML)</div>
        <div class="metric-value ${mlColor}">${mlPct}</div>
      </div>
      <div>
        <div class="metric-label">Odds Over 2.5</div>
        <div class="metric-value ${odColor}">${m.over25odds ? m.over25odds.toFixed(2) : '—'}</div>
      </div>
      <div>
        <div class="metric-label">Odds Under 2.5</div>
        <div class="metric-value">${m.under25odds ? m.under25odds.toFixed(2) : '—'}</div>
      </div>
      <div>
        <div class="metric-label">Movimento mercado</div>
        <div class="metric-value ${mvColor}">${mvTxt}</div>
      </div>
      <div>
        <div class="metric-label">Score previsto</div>
        <div class="metric-value">${m.predScore || '—'}</div>
      </div>
      <div>
        <div class="metric-label">Confiança ML</div>
        <div class="metric-value">${confStr}</div>
      </div>
      <div>
        <div class="metric-label">ML Over 2.5</div>
        <div class="metric-value ${m.recommend ? 'mv-green' : ''}">${m.recommend ? '✓ Recomenda' : 'Não'}</div>
      </div>
    </div>
    ${bestOdds.length ? `
    <button class="expand-btn" onclick="toggleOdds(${m.id})">▼ Ver odds por bookmaker</button>
    <div id="odds-${m.id}" style="display:none;margin-top:8px">
      <table class="odds-table">
        <thead><tr><th>Bookmaker</th><th>Odds</th><th>Movimento</th></tr></thead>
        <tbody>${oddsRows}</tbody>
      </table>
    </div>` : ''}
  </div>`;
}

function toggleOdds(id) {
  const el = document.getElementById('odds-' + id);
  const btn = el.previousElementSibling;
  if (el.style.display === 'none') {
    el.style.display = 'block';
    btn.textContent = '▲ Fechar odds';
  } else {
    el.style.display = 'none';
    btn.textContent = '▼ Ver odds por bookmaker';
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.className = 'error-box';
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}
</script>
</body>
</html>
