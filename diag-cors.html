<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico CORS — BSD API</title>
<style>
  body{background:#111;color:#eee;font:14px/1.5 system-ui,sans-serif;margin:0;padding:16px}
  h1{font-size:16px;margin:0 0 4px}
  p.sub{color:#888;font-size:12px;margin:0 0 16px}
  input{width:100%;padding:10px;background:#1c1c1c;border:1px solid #333;color:#eee;border-radius:6px;font-size:15px;box-sizing:border-box}
  button{width:100%;padding:12px;margin-top:10px;background:#d4a017;border:0;border-radius:6px;font-size:15px;font-weight:600}
  .t{margin-top:16px;padding:12px;background:#1a1a1a;border-radius:6px;border-left:3px solid #444}
  .t h2{font-size:13px;margin:0 0 6px;color:#d4a017}
  .r{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#bbb}
  .ok{border-left-color:#3a3}.ok h2{color:#5c5}
  .bad{border-left-color:#a33}.bad h2{color:#e66}
  .verdict{margin-top:20px;padding:14px;background:#1a1a1a;border-radius:6px;font-size:13px}
  .origem{color:#666;font-size:11px;margin-top:20px;word-break:break-all}
</style>
</head>
<body>

<h1>Diagnóstico CORS — BSD API</h1>
<p class="sub">Página isolada. Não toca em nada do scanner.</p>

<input id="key" type="text" placeholder="BSD API Key (opcional — só para o Teste 2)" autocomplete="off">
<button onclick="run()">Correr diagnóstico</button>

<div class="t" id="t1"><h2>Teste 1 — GET sem Authorization (pedido simples, sem preflight)</h2><div class="r" id="r1">—</div></div>
<div class="t" id="t2"><h2>Teste 2 — GET com Authorization (obriga a preflight OPTIONS)</h2><div class="r" id="r2">—</div></div>
<div class="verdict" id="v">Carrega no botão para começar.</div>
<div class="origem" id="o"></div>

<script>
const BASE = 'https://sports.bzzoiro.com';
const PATH = '/api/v2/events/?limit=1';
const $ = id => document.getElementById(id);

document.getElementById('o').textContent = 'Origem desta página: ' + location.origin;

function mark(n, ok, txt){
  const box = $('t'+n);
  box.className = 't ' + (ok ? 'ok' : 'bad');
  $('r'+n).textContent = txt;
}

async function probe(n, headers){
  try{
    const r = await fetch(BASE + PATH, {headers});
    let body = '';
    try { body = (await r.text()).slice(0, 200); } catch(e){}
    mark(n, true, 'Resposta recebida.\nHTTP ' + r.status + ' ' + r.statusText + '\n\n' + body);
    return {reached:true, status:r.status};
  }catch(e){
    mark(n, false, 'SEM RESPOSTA.\n' + e.name + ': ' + e.message);
    return {reached:false, err:e.message};
  }
}

async function run(){
  $('v').textContent = 'A correr…';
  ['1','2'].forEach(n=>{ $('t'+n).className='t'; $('r'+n).textContent='a testar…'; });

  const a = await probe(1, {});

  const key = $('key').value.trim();
  let b = null;
  if(key){
    b = await probe(2, {'Authorization':'Token ' + key});
  } else {
    $('r2').textContent = 'Ignorado — sem chave preenchida.';
  }

  let v;
  if(!a.reached){
    v = 'VEREDICTO: o servidor não envia Access-Control-Allow-Origin para esta origem. '
      + 'Nem um pedido simples passa. Não há correção possível no frontend — ou o fornecedor '
      + 'da BSD autoriza a origem, ou avança o Bloco C estrutural (o browser deixa de chamar '
      + 'a API e passa a ler data/*.json do repo).';
  } else if(!key){
    v = 'Teste 1 passou: o CORS básico funciona para esta origem. Preenche a chave e corre '
      + 'outra vez — o Teste 2 é o que interessa, porque é o preflight que o Authorization obriga.';
  } else if(b.reached){
    v = 'VEREDICTO: ambos passaram. O CORS está bem e o preflight também. A causa do '
      + '"Failed to fetch" no scanner NÃO é CORS — é outra coisa no index.html. '
      + 'Guarda este resultado e volta ao plano.';
  } else {
    v = 'VEREDICTO: pedido simples passa, pedido com Authorization falha. É o preflight OPTIONS '
      + 'a ser rejeitado — falta Access-Control-Allow-Headers: Authorization no servidor. '
      + 'Correção do lado do fornecedor da BSD, curta. Alternativa: Bloco C estrutural.';
  }
  $('v').textContent = v;
}
</script>

</body>
</html>
