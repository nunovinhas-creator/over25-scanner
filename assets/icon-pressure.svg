  <path d="M12 7 C12 7 13.5 10 14 12 C14.8 10.2 15 8.5 14.2 7 C15.5 8.5 16 11 15 13.5 C15.5 12.5 15.8 11.5 15.5 10 C16 11.5 16 14 14.5 16 C13.5 17.5 12 19 12 19 C12 19 10.5 17.5 9.5 16 C8 14 8 11.5 8.5 10 C8.2 11.5 8.5 12.5 9 13.5 C8 11 8.5 8.5 9.8 7 C9 8.5 9.2 10.2 10 12 C10.5 10 12 7 12 7Z"
