<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <radialGradient id="live-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF3B3B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
    <filter id="live-blur">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer ring - subtle -->
  <circle cx="12" cy="12" r="10" stroke="#FF3B3B" stroke-width="0.75" stroke-opacity="0.3" fill="none"/>
  <!-- Middle ring -->
  <circle cx="12" cy="12" r="7" stroke="#FF3B3B" stroke-width="0.75" stroke-opacity="0.5" fill="none" stroke-dasharray="2.5 2"/>
  <!-- Glow halo -->
  <circle cx="12" cy="12" r="5.5" fill="url(#live-glow)" opacity="0.45"/>
  <!-- Inner solid dot with glow filter -->
  <circle cx="12" cy="12" r="4" fill="#FF3B3B" filter="url(#live-blur)"/>
  <!-- Bright core -->
  <circle cx="12" cy="12" r="3" fill="#FF6B6B"/>
  <!-- Specular highlight -->
  <circle cx="10.8" cy="10.8" r="1" fill="#FFFFFF" opacity="0.45"/>
</svg>
