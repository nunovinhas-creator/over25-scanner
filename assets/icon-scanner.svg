<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <radialGradient id="scan-lens" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#2D3440"/>
      <stop offset="100%" stop-color="#111315"/>
    </radialGradient>
  </defs>
  <!-- Magnifying glass handle -->
  <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#D4AF37" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Lens body -->
  <circle cx="10" cy="10" r="7.5" fill="url(#scan-lens)" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Inner lens ring -->
  <circle cx="10" cy="10" r="5.5" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.45" fill="none"/>
  <!-- Reticle: horizontal crosshair -->
  <line x1="5.5" y1="10" x2="8.2" y2="10" stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="11.8" y1="10" x2="14.5" y2="10" stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Reticle: vertical crosshair -->
  <line x1="10" y1="5.5" x2="10" y2="8.2" stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="10" y1="11.8" x2="10" y2="14.5" stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Center targeting dot -->
  <circle cx="10" cy="10" r="1.2" fill="#D4AF37"/>
  <!-- Corner tick marks -->
  <path d="M6.5 6.5 L6.5 8 M6.5 6.5 L8 6.5" stroke="#D4AF37" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M13.5 6.5 L13.5 8 M13.5 6.5 L12 6.5" stroke="#D4AF37" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M6.5 13.5 L6.5 12 M6.5 13.5 L8 13.5" stroke="#D4AF37" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M13.5 13.5 L13.5 12 M13.5 13.5 L12 13.5" stroke="#D4AF37" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Lens glare -->
  <ellipse cx="7.5" cy="7.2" rx="1.8" ry="1" fill="#FFFFFF" opacity="0.08" transform="rotate(-30 7.5 7.2)"/>
</svg>
