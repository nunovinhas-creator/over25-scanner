<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="pin-body" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E8CB5A"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A08020"/>
    </linearGradient>
    <linearGradient id="pin-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pin-shadow">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Pin body (rounded top, tapers to point) -->
  <path d="M12 2 C8.5 2 6 4.8 6 8 C6 11.5 9.5 15 12 20.5 C14.5 15 18 11.5 18 8 C18 4.8 15.5 2 12 2Z"
        fill="url(#pin-body)" filter="url(#pin-shadow)"/>
  <!-- Shine highlight on left side of pin -->
  <path d="M9 3.5 C7.5 4.8 6.5 6.3 6.5 8 C6.5 9.2 7 10.5 7.8 11.8 C7 10.2 6.8 8.8 7.2 7.5 C7.6 5.8 8.5 4.5 9 3.5Z"
        fill="url(#pin-shine)"/>
  <!-- Inner circle on pin head -->
  <circle cx="12" cy="8" r="2.5" fill="#0A0A0C" opacity="0.6"/>
  <circle cx="12" cy="8" r="1.5" fill="#D4AF37" opacity="0.7"/>
  <!-- Specular dot -->
  <circle cx="10.8" cy="6.8" r="0.7" fill="#FFFFFF" opacity="0.5"/>
</svg>
