<head>
  <meta charset="UTF-8"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0A0A0C;
      color: #E0E0E0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      color: #D4AF37;
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 32px;
    }

    /* KPI cards */
    .kpi-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 36px;
    }

    .kpi-card {
      background: #1A1A2E;
      border: 1px solid #2A2A3A;
      border-radius: 10px;
      padding: 18px 28px;
      min-width: 160px;
      text-align: center;
    }

    .kpi-label {
      font-size: 0.72rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.65rem;
      font-weight: 700;
      color: #D4AF37;
    }

    .kpi-value.green { color: #39FF14; }
    .kpi-value.red   { color: #FF3B3B;   }

    .kpi-card.wide {
      min-width: 260px;
    }

    /* Chart grid */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .chart-card {
      background: #12121A;
      border: 1px solid #2A2A3A;
      border-radius: 12px;
      padding: 8px;
      overflow: hidden;
    }

    /* Make embedded plotly divs fill the card */
    .chart-card .plotly-graph-div {
      width: 100% !important;
    }

    @media (max-width: 640px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
