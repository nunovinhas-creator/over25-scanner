name: Update README

on:
  push:
    branches:
      - main
    paths:
      - CLAUDE.md
      - data/picks.json
      - data/picks_1x2.json
      - data/picks_btts_over25.json
      - data/observations.json
      - version.json
  schedule:
    # Most of the paths above (picks*.json, observations.json) are updated by the
    # auto-scan bot every 30min, which doesn't trigger push workflows (GITHUB_TOKEN
    # anti-loop rule) — same staleness issue as dashboard.yml. 07:45 UTC: after
    # data_quality.yml (07:00) and dashboard.yml (07:30), to avoid racing dashboard's
    # push to main and to reflect the freshly regenerated dashboard/picks of the day.
    - cron: "45 7 * * *"

jobs:
  update_readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Regenerate README dynamic section
        run: python scripts/generate_readme.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Sem alterações no README."
          else
            git commit -m "[skip ci] update README"
            git pull --rebase origin main
            git push origin main
          fi
