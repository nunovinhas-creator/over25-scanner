name: Scanner LIVE (ao minuto)

# Alertas "🔥 APOSTAR AGORA" ao MINUTO, independentes do browser.
#
# O cron do GitHub Actions NÃO é fiável ao minuto (mínimo ~5 min, com atrasos),
# por isso a cadência real ao minuto vem de um job de longa duração que faz scan
# a cada 60s durante ~5h50 (< 6h, limite do runner). O cron abaixo só ARRANCA o
# job nas janelas de jogos; o loop interno é que garante o "ao minuto".
#
# Cobertura 24h/dia (repo público = minutos de Actions ilimitados). Cada job faz
# scan ao minuto durante ~5h50; encadeamos 6 arranques espaçados de 4h para cobrir
# as 24h com folga: 4h de espaçamento vs ~5h50 de duração = ~1h50 de sobreposição
# por transição, para absorver atrasos de arranque do cron do GitHub.
#
# Arranques (UTC), ao minuto 7 (fora do :00) para fugir à congestão do scheduler:
#   00:07 · 04:07 · 08:07 · 12:07 · 16:07 · 20:07
# concurrency cancel-in-progress: cada novo arranque substitui limpo o anterior.
# Também arrancável à mão (workflow_dispatch) antes de qualquer jogo.

on:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duração do loop em minutos (máx 350)"
        required: false
        default: "350"

concurrency:
  group: live-scanner
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 358  # < 360 (limite do runner); o loop sai antes por --minutes

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install --quiet requests

      - name: Loop LIVE ao minuto
        # -u / PYTHONUNBUFFERED: output em tempo real no log do Actions (stdout
        # bufferizado só apareceria no fim do job, ~5h depois).
        run: python -u -m pipeline.scan_live --loop --interval 60 --minutes ${{ github.event.inputs.minutes || '350' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
