name: Fetch BSD Leagues (one-shot)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run fetch script
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python scripts/fetch_bsd_leagues.py
