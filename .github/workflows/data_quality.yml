name: Data Quality & Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: odds-classification-js — classifyOdds() (index.html) vs a mesma
  # spec partilhada que valida classify_odds() (Python). Ver
  # docs/odds_validation.md e tests/fixtures/odds_classification_spec.json.
  # ---------------------------------------------------------------------------
  odds-classification-js:
    name: Odds classification (JS vs spec partilhada)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run classifyOdds() against shared spec
        run: node tests/js/test_classify_odds.mjs

  # ---------------------------------------------------------------------------
  # Job 1: validate — schema checks + data quality tests
  # ---------------------------------------------------------------------------
  validate:
    name: Schema & Data Quality
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas>=2.0.0 \
            numpy>=1.24.0 \
            scipy>=1.11.0 \
            scikit-learn>=1.3.0 \
            pandera>=0.17.0 \
            pytest>=7.4.0 \
            requests>=2.31.0 \
            python-dotenv>=1.0.0

      - name: Run ETL validation
        run: python pipeline/etl.py --validate

      - name: Run data quality tests
        run: pytest tests/data_quality/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: backtest — walk-forward backtesting across all strategies
  # ---------------------------------------------------------------------------
  backtest:
    name: Backtesting
    runs-on: ubuntu-latest
    needs: validate
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas>=2.0.0 \
            numpy>=1.24.0 \
            scipy>=1.11.0 \
            scikit-learn>=1.3.0 \
            pandera>=0.17.0 \
            pytest>=7.4.0

      - name: Create reports directory
        run: mkdir -p backtesting/reports

      - name: Run backtests (all strategies)
        run: |
          python backtesting/run_backtest.py \
            --strategy all \
            --format json \
            --output backtesting/reports/

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports-${{ github.run_number }}
          path: backtesting/reports/
          retention-days: 30
          if-no-files-found: warn
