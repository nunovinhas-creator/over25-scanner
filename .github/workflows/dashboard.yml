name: Dashboard Update

on:
  push:
    branches: [main]
    paths:
      # Only re-generate the dashboard when picks data actually changes
      - "data/picks.json"
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI
  schedule:
    # Auto-scan commits (bot, every 30min) don't trigger push workflows (GITHUB_TOKEN
    # anti-loop rule), so the push trigger above can go stale for days. Daily cron picks
    # up the slack — 07:30 UTC, after data_quality.yml's 07:00 run, so the dashboard
    # reflects already-validated data.
    - cron: "30 7 * * *"

jobs:
  # ---------------------------------------------------------------------------
  # Regenerate analytics.html from the latest picks data
  # ---------------------------------------------------------------------------
  update-dashboard:
    name: Generate Analytics Dashboard
    runs-on: ubuntu-latest
    # Prevent concurrent runs from creating rebase conflicts on analytics.html
    concurrency:
      group: dashboard-update
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}

    permissions:
      contents: write  # needed to push the generated HTML back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git diff works correctly
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            plotly>=5.17.0 \
            pandas>=2.0.0 \
            numpy>=1.24.0 \
            scikit-learn>=1.3.0 \
            scipy>=1.11.0

      - name: Generate dashboard HTML
        run: python dashboard/generate_dashboard.py --output dashboard/analytics.html

      - name: Check if dashboard changed
        id: diff
        run: |
          if git diff --quiet dashboard/analytics.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated dashboard
        if: steps.diff.outputs.changed == 'true'
        # Mesmo padrão de retry usado em deploy_version.yml/update_readme.yml: até 5
        # tentativas, fetch + `git reset --mixed origin/main` antes de cada push
        # (analytics.html já foi gerado no passo anterior e fica inalterado no
        # disco entre tentativas — --mixed não toca na working tree). Substitui o
        # `git pull --rebase -X theirs` anterior, que não tinha retry nenhum: uma
        # rejeição de push por corrida com outro workflow (ex.: deploy_version.yml,
        # scanner.yml) fazia o job falhar directamente.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add dashboard/analytics.html

            if git diff --cached --quiet; then
              echo "Sem alterações para commitar (outro workflow já publicou o mesmo dashboard)."
              exit 0
            fi

            git commit -m "chore: regenerate analytics dashboard [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${tentativa}/5) — outro workflow avançou main entretanto. A repetir após novo fetch..."
            sleep $((tentativa * 3))
          done

          echo "::error::dashboard: falha a fazer push após 5 tentativas — corrida persistente de push com outro workflow em main." >&2
          exit 1
