name: WS Closing Odds

on:
  schedule:
    # A cada 30 min, desfasado 10 min do scanner.yml para reduzir corridas
    # de commit. O script sai imediatamente se não houver picks com KO na
    # janela seguinte (WS_WINDOW_MIN) — corridas vazias custam segundos.
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: ws-closing-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install websockets
      - name: Capture closing odds via WebSocket
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          WS_WINDOW_MIN: "40"
          WS_MAX_RUNTIME_MIN: "50"
        run: python -m pipeline.ws_closing_odds
