name: Probe BSD WebSocket (one-shot)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests websockets
      - name: Probe BSD WebSocket
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python scripts/probe_bsd_ws.py
