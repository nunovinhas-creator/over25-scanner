name: Gov Eval — Governance Scenarios

on:
  push:
    branches: [main]
    paths:
      - ".claude/rules/**"
      - "CLAUDE.md"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Cenário a testar (GOV-01..GOV-05 ou 'all')"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - GOV-01
          - GOV-02
          - GOV-03
          - GOV-04
          - GOV-05

jobs:
  gov-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar Gov Eval (sem API)
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, sys

          # Cada cenário define:
          #   rule_file  — ficheiro de regra que DEVE conter a protecção
          #   must_have  — padrões obrigatórios no ficheiro de regra (garante que a regra existe)
          #   must_not   — padrões que NÃO devem existir no ficheiro de regra
          #   description — o que o cenário valida
          SCENARIOS = {
            "GOV-01": {
              "description": "Liga fora da whitelist — protecção documentada em data.md",
              "rule_file": ".claude/rules/data.md",
              "must_have": [
                r"whitelist",
                r"fail.closed",
                r"ID desconhecido",
                r"requisit",             # requisitos para adicionar liga
                r"BSD_LEAGUE_ID_MAP",
              ],
              "must_not": [],
            },
            "GOV-02": {
              "description": "Kelly Criterion — DESACTIVADO documentado em decisions.md",
              "rule_file": ".claude/rules/decisions.md",
              "must_have": [
                r"Kelly",
                r"DESACTIV",
                r"ValueError",
                r"CLV.*rolling|rolling.*CLV",
                r"n.*[0-9]{3}.*settled|settled.*[0-9]{3}",
              ],
              "must_not": [
                r"Kelly.*ACTIVO",
              ],
            },
            "GOV-03": {
              "description": "data_quality_flag — não pode ser removido; documentado em data.md",
              "rule_file": ".claude/rules/data.md",
              "must_have": [
                r"data_quality_flag",
                r"exclu[íi]dos",
                r"KPI",
                r"17 jun|21 jun",        # datas de activação
                r"contamin|invalida",
              ],
              "must_not": [],
            },
            "GOV-04": {
              "description": "Anti-leakage walk-forward — documentado em testing.md",
              "rule_file": ".claude/rules/testing.md",
              "must_have": [
                r"leakage|leak",
                r"walk.forward",
                r"LOEO|Leave-One-Era",
                r"Proibido validar no conjunto de treino",
                r"out.of.sample|OOS",
              ],
              "must_not": [],
            },
            "GOV-05": {
              "description": "DRAW Eredivisie — gate n≥50 CLV>+1% documentado em decisions.md",
              "rule_file": ".claude/rules/decisions.md",
              "must_have": [
                r"DRAW",
                r"Eredivisie",
                r"50.settled|settled.*50",
                r"CLV.*1%|1%.*CLV",
                r"SUSPENSO",
              ],
              "must_not": [
                r"DRAW.*ACTIVO",
              ],
            },
          }

          target = os.environ.get("SCENARIO", "all").strip() or "all"
          to_run = list(SCENARIOS.keys()) if target == "all" else [target]

          results = {}
          all_pass = True

          for gov_id in to_run:
            s = SCENARIOS[gov_id]
            print(f"\n{'='*60}")
            print(f"  {gov_id} — {s['description']}")
            print(f"{'='*60}")

            rule_path = s["rule_file"]
            if not os.path.exists(rule_path):
              print(f"  ❌ FAIL — ficheiro não encontrado: {rule_path}")
              results[gov_id] = {"status": "FAIL", "reason": f"ficheiro ausente: {rule_path}"}
              all_pass = False
              continue

            with open(rule_path) as f:
              content = f.read()

            failures = []

            for pattern in s["must_have"]:
              if not re.search(pattern, content, re.IGNORECASE):
                failures.append(f"must_have não encontrado: /{pattern}/")

            for pattern in s["must_not"]:
              if re.search(pattern, content, re.IGNORECASE):
                failures.append(f"must_not presente: /{pattern}/")

            if failures:
              print(f"  ❌ FAIL")
              for f_ in failures:
                print(f"     • {f_}")
              results[gov_id] = {"status": "FAIL", "failures": failures}
              all_pass = False
            else:
              print(f"  ✅ PASS — todos os {len(s['must_have'])} padrões obrigatórios presentes")
              results[gov_id] = {"status": "PASS"}

          print(f"\n{'='*60}")
          print("  SUMÁRIO")
          print(f"{'='*60}")
          for gov_id, r in results.items():
            icon = "✅" if r["status"] == "PASS" else "❌"
            print(f"  {icon}  {gov_id}: {r['status']}")

          final = "✅ ALL PASS" if all_pass else "❌ FALHAS DETECTADAS"
          print(f"\n  RESULTADO FINAL: {final}")
          print(f"{'='*60}\n")

          with open("/tmp/gov_eval_results.json", "w") as f:
            json.dump(results, f, indent=2, ensure_ascii=False)

          sys.exit(0 if all_pass else 1)
          PYEOF

      - name: Upload resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-eval-results
          path: /tmp/gov_eval_results.json
          if-no-files-found: ignore
