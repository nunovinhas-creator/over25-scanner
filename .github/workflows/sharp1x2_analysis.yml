name: Sharp 1X2 signal analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # a cada 30 min — janela de closing odds

jobs:
  settle_and_close_odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet requests

      # Settlement corre SEMPRE antes do fecho de odds — só faz sentido tentar
      # odds_fecho depois de sabermos que o pick está settled (WIN/LOSS/VOID).
      # Mesmo job, passos sequenciais (não jobs paralelos): ambos os passos
      # fazem `git reset --soft origin/main` + commit + push sobre o mesmo
      # ficheiro (picks_1x2.json) — correr em paralelo arriscaria overwrite.
      - name: Settle Sharp 1X2 results
        run: python -m pipeline.settle_sharp1x2
        env:
          PYTHONPATH: ${{ github.workspace }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}

      - name: Update closing odds
        run: python -m pipeline.update_closing_odds
        env:
          PYTHONPATH: ${{ github.workspace }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # Over 2.5 (Bloco I, 10 ago 2026): ficheiro diferente (picks.json), sem
      # dependência de settlement — janela ancorada no KO, não em settled_at
      # (ver docstring de pipeline/update_closing_odds_over25.py). Passo
      # sequencial pela mesma razão dos dois de cima: nunca correr em
      # paralelo com escritas a ficheiros diferentes que partilham o mesmo
      # padrão `git reset --soft origin/main` + commit + push.
      - name: Update closing odds Over 2.5
        run: python -m pipeline.update_closing_odds_over25
        env:
          PYTHONPATH: ${{ github.workspace }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}

  analyse:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet pandas numpy scipy pyarrow

      - name: Check 1X2 column availability
        id: check
        run: |
          python - <<'EOF'
          import sys
          import pandas as pd
          from pathlib import Path
          csv = Path("data/historical/matches.csv")
          if not csv.exists():
              print("HAS_1X2=false")
              sys.exit(0)
          df = pd.read_csv(csv, nrows=5)
          has = "PSH" in df.columns
          print(f"HAS_1X2={'true' if has else 'false'}")
          EOF
          python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import pandas as pd
          from pathlib import Path
          csv = Path("data/historical/matches.csv")
          if not csv.exists():
              print("has_1x2=false")
          else:
              df = pd.read_csv(csv, nrows=5)
              print(f"has_1x2={'true' if 'PSH' in df.columns else 'false'}")
          PYEOF

      - name: Warn if 1X2 columns absent
        if: steps.check.outputs.has_1x2 == 'false'
        run: |
          echo "::warning::Colunas 1X2 não encontradas em matches.csv. Corre 'Update historical data' com mode=full-1x2 primeiro."

      - name: Run sharp 1X2 analysis
        run: |
          python -m backtesting.run_sharp1x2_signal
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit analysis report
        # Mesmo padrão de retry usado em deploy_version.yml/update_readme.yml: até 5
        # tentativas, fetch + `git reset --mixed origin/main` antes de cada push
        # (sharp1x2_signal.md já foi gerado no passo anterior e fica inalterado no
        # disco entre tentativas — --mixed não toca na working tree). `--mixed`,
        # nunca `--soft`: ver git_commit_push() em pipeline/scan_common.py.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add backtesting/reports/sharp1x2_signal.md || true

            if git diff --cached --quiet; then
              echo "Sem alterações no relatório."
              exit 0
            fi

            git commit -m "analysis: sharp 1X2 signal report [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${tentativa}/5) — outro workflow avançou main entretanto. A repetir após novo fetch..."
            sleep $((tentativa * 3))
          done

          echo "::error::sharp1x2_analysis (analyse): falha a fazer push após 5 tentativas — corrida persistente de push com outro workflow em main." >&2
          exit 1
