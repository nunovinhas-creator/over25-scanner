name: Update historical data

on:
  schedule:
    # Every Monday at 06:00 UTC (football-data.co.uk updates Monday mornings)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Download mode"
        required: false
        default: "download-all"
        type: choice
        options:
          - download-all
          - update
          - full-1x2

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet pandas numpy scipy pyarrow

      - name: Determine download mode
        id: mode
        run: |
          # workflow_dispatch uses chosen input; scheduled run always uses "update"
          MODE="${{ github.event.inputs.mode || 'update' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Download historical data from football-data.co.uk
        run: |
          python -m pipeline.historical --${{ steps.mode.outputs.mode }}
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Show dataset summary
        run: |
          python - <<'EOF'
          import pandas as pd
          df = pd.read_csv("data/historical/matches.csv")
          print(f"Total rows : {len(df):,}")
          print(f"Date range : {df['Date'].min()} → {df['Date'].max()}")
          print(f"Seasons    : {sorted(df['Season'].unique())}")
          print(f"Divisions  : {sorted(df['Div'].unique())}")
          has_1x2 = "PSH" in df.columns and df["PSH"].notna().any()
          print(f"1X2 cols   : {'present' if has_1x2 else 'absent — run full-1x2 to add'}")
          if has_1x2:
              print(f"  PSH non-null: {df['PSH'].notna().sum():,} / {len(df):,}")
          EOF

      - name: Commit updated dataset
        # Mesmo padrão de retry usado em deploy_version.yml/update_readme.yml: até 5
        # tentativas, fetch + `git reset --mixed origin/main` antes de cada push
        # (matches.csv/.parquet já foram descarregados no passo anterior e ficam
        # inalterados no disco entre tentativas — --mixed não toca na working tree).
        # `--mixed`, nunca `--soft`: --soft deixa o índice preso ao commit local
        # anterior, e numa 2ª tentativa qualquer ficheiro alterado por OUTRO
        # workflow em main entretanto fica silenciosamente revertido no commit
        # resultante (mesmo bug corrigido em git_commit_push(), pipeline/scan_common.py,
        # e em update_readme.yml/#164).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NROWS=""
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/historical/matches.csv
            [ -f data/historical/matches.parquet ] && git add data/historical/matches.parquet || true

            if git diff --cached --quiet; then
              echo "Sem alterações para commitar."
              exit 0
            fi

            [ -z "$NROWS" ] && NROWS=$(python -c "import pandas as pd; print(f\"{len(pd.read_csv('data/historical/matches.csv')):,}\")")
            git commit -m "data: update historical matches ($NROWS rows) [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${tentativa}/5) — outro workflow avançou main entretanto. A repetir após novo fetch..."
            sleep $((tentativa * 3))
          done

          echo "::error::historical_data: falha a fazer push após 5 tentativas — corrida persistente de push com outro workflow em main." >&2
          exit 1
