name: Retrain DC + Recalibrate

on:
  schedule:
    # Every Monday at 07:00 UTC (after historical_data.yml at 06:00)
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet pandas numpy scipy pyarrow scikit-learn

      - name: Train Dixon-Coles ratings
        run: |
          python -m models.train_dc \
            --data data/historical/matches.csv \
            --out data/dc_ratings.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Recalibrate (LOEO-CV + epoch 2526 validation)
        run: |
          rm -f /tmp/over25_oos_cache.parquet
          python -m backtesting.run_calibration \
            --data data/historical/matches.csv \
            --out data/calibrator.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Show calibration summary
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          dc = json.loads(Path("data/dc_ratings.json").read_text())
          cal = json.loads(Path("data/calibrator.json").read_text())

          print(f"DC ratings: {len(dc)} leagues fitted")
          for league, info in sorted(dc.items()):
              status = "✓" if info["converged"] else "✗"
              print(f"  {status} {league:25s}  n={info['n_games']:4d}  rho={info['rho']:+.4f}")

          print(f"\nCalibrator: {cal['method']}, n_train={cal['n_train']:,}")
          print(f"CV Brier (LOEO): {cal['cv_brier_loeo']:.5f}")
          EOF

      - name: Sharp 1X2 — relatório semanal Telegram
        run: |
          python backtesting/send_sharp1x2_weekly.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Commit updated ratings and calibrator
        # Mesmo padrão de retry usado em deploy_version.yml/update_readme.yml: até 5
        # tentativas, fetch + `git reset --mixed origin/main` antes de cada push
        # (dc_ratings.json/calibrator.json/relatório já foram gerados nos passos
        # anteriores e ficam inalterados no disco entre tentativas — --mixed não
        # toca na working tree). `--mixed`, nunca `--soft`: ver historical_data.yml
        # e git_commit_push() em pipeline/scan_common.py para o porquê.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/dc_ratings.json data/calibrator.json
            [ -f backtesting/reports/calibration_validation.md ] && \
              git add backtesting/reports/calibration_validation.md || true

            if git diff --cached --quiet; then
              echo "Sem alterações para commitar."
              exit 0
            fi

            DATE=$(date -u +%Y-%m-%d)
            git commit -m "model: retrain DC + recalibrate ($DATE) [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${tentativa}/5) — outro workflow avançou main entretanto. A repetir após novo fetch..."
            sleep $((tentativa * 3))
          done

          echo "::error::retrain_dc: falha a fazer push após 5 tentativas — corrida persistente de push com outro workflow em main." >&2
          exit 1
